name: CI

on:
  push:
    branches: [main, stage-2-mcp-wrapper]
  pull_request:

jobs:
  stage-2-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: |
          node --check server.js
          node --check scripts/mcp-smoke.mjs
      - name: Start MCP server and exercise MCP tools
        run: |
          node server.js > /tmp/chappie.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          READY=0
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/ | grep -q "Chappie MCP Apps server"; then
              READY=1
              break
            fi
            sleep 0.5
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/chappie.log
            exit 1
          fi

          if ! npm run smoke:mcp; then
            cat /tmp/chappie.log
            exit 1
          fi
