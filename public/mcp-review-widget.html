<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chappie review</title>
<style>
:root{color-scheme:light dark;--text:#1f2328;--muted:#667085;--border:#d0d5dd;--card:#fff;--panel:#f8fafc;--accent:#2563eb;--good:#16794b;--bad:#b42318}
@media(prefers-color-scheme:dark){:root{--text:#f5f7fa;--muted:#a8b0bd;--border:#3a4350;--card:#171a1f;--panel:#22262d;--accent:#7aa2ff;--good:#62c591;--bad:#ff8b84}}
*{box-sizing:border-box}body{margin:0;padding:20px;background:transparent;color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.review{width:100%;max-width:736px;margin:0 auto}.card{border:1px solid var(--border);border-radius:12px;padding:20px;background:var(--card)}h2{margin:0 0 8px;font-size:17px}.intro{margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.55}.question{border-top:1px solid var(--border);padding:18px 0}.question:first-of-type{border-top:0;padding-top:0}.meta{margin-bottom:5px;color:var(--muted);font-size:12px;font-weight:650}.prompt{margin-bottom:10px;font-size:16px;line-height:1.6;white-space:pre-wrap}.input,.textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);font:inherit;font-size:16px;outline:none}.textarea{min-height:82px;resize:vertical}.choice{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;line-height:1.45}.choice input{margin-top:4px;accent-color:var(--accent)}.feedback{margin-top:10px;padding:9px 11px;border-radius:8px;background:var(--panel);font-size:14px;line-height:1.5}.feedback[hidden],.summary[hidden]{display:none}.good{color:var(--good)}.bad{color:var(--bad)}.muted{color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.button{min-height:44px;padding:9px 15px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text);font:inherit;font-weight:650;cursor:pointer}.primary{border-color:var(--accent);background:var(--accent);color:#fff}.button:disabled{opacity:.6;cursor:not-allowed}.summary{margin-top:18px;border:1px solid var(--border);border-radius:10px;padding:14px;line-height:1.55}.answers{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--panel);white-space:pre-wrap;font-size:13px}.status{margin-top:8px;color:var(--muted);font-size:13px}.empty{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div id="app" class="empty">Loading review…</div>
<script type="module">
const app=document.getElementById("app");let rpcId=0;const pending=new Map();let bridgeReady=false;
const request=(method,params)=>new Promise((resolve,reject)=>{const id=++rpcId;pending.set(id,{resolve,reject});window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*")});
const notify=(method,params)=>window.parent.postMessage({jsonrpc:"2.0",method,params},"*");
window.addEventListener("message",event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=="2.0")return;if(typeof m.id==="number"){const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.error?p.reject(m.error):p.resolve(m.result);return}if(m.method==="ui/notifications/tool-result")renderFromResult(m.params)});
function renderFromResult(result){const data=result?.structuredContent?.review;if(data)mount(data)}
function responseFor(item){if(item.question.type==="multiple_choice"){const checked=item.control.querySelector('input[type="radio"]:checked');if(!checked)return{raw:"",value:""};const option=(item.question.options||[]).find(o=>o.value===checked.value);return{raw:option?.label||checked.value,value:checked.value}}const raw=item.control.value;return{raw,value:raw.trim()}}
function formatted(payload){const lines=["Chappie review answers",`Session: ${payload.reviewId}`,""];payload.responses.forEach((r,i)=>{lines.push(`Q${i+1} — ${r.prompt}`);lines.push(r.response||"[unanswered]");if(r.localStatus)lines.push(`Local status: ${r.localStatus}`);lines.push("")});return lines.join("\n")}
async function copyText(text){try{await navigator.clipboard.writeText(text);return true}catch{}const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.append(ta);ta.select();const ok=document.execCommand("copy");ta.remove();return ok}
async function sendForReview(payload,statusEl){const answerText=formatted(payload);const context={reviewSubmission:payload,semanticReviewRules:["Review every answer","Classify Correct, Partly correct, or Incorrect","State what the learner already knew","Give the correct answer and explain gaps","Keep correct-answer feedback short and give more detail for partial/incorrect answers","Treat score as secondary"]};try{if(bridgeReady){try{await request("ui/update-model-context",{structuredContent:context})}catch(error){console.warn("Model-context update unavailable",error)}await request("ui/message",{role:"user",content:[{type:"text",text:`Please review these Chappie answers semantically. Do not exact-string grade free-text responses.\n\n${answerText}`}]});statusEl.textContent="Answers sent to the conversation for review.";return}}catch(error){console.error("Unable to send answers through MCP Apps bridge",error)}if(window.openai?.sendFollowUpMessage){try{await window.openai.sendFollowUpMessage({prompt:`Please review these Chappie answers semantically. Do not exact-string grade free-text responses.\n\n${answerText}`});statusEl.textContent="Answers sent to the conversation for review.";return}catch(error){console.error("ChatGPT compatibility handoff failed",error)}}statusEl.textContent="Automatic handoff is unavailable here. Use Copy answers below."}
function mount(data){app.className="";app.replaceChildren();const shell=document.createElement("section");shell.className="review";const card=document.createElement("div");card.className="card";if(data.title){const h=document.createElement("h2");h.textContent=data.title;card.append(h)}if(data.intro){const intro=document.createElement("p");intro.className="intro";intro.textContent=data.intro;card.append(intro)}const form=document.createElement("form");const rendered=[];(data.questions||[]).forEach((question,index)=>{const section=document.createElement("section");section.className="question";const meta=document.createElement("div");meta.className="meta";meta.textContent=`Q${index+1}${question.label?` · ${question.label}`:""}`;const prompt=document.createElement("div");prompt.className="prompt";prompt.textContent=question.prompt||"";section.append(meta,prompt);let control;if(question.type==="multiple_choice"){control=document.createElement("div");(question.options||[]).forEach(option=>{const label=document.createElement("label");label.className="choice";const radio=document.createElement("input");radio.type="radio";radio.name=`ch-${data.id}-${question.id}`;radio.value=option.value;const span=document.createElement("span");span.textContent=option.label;label.append(radio,span);control.append(label)})}else if(question.type==="textarea"){control=document.createElement("textarea");control.className="textarea";control.autocomplete="off"}else{control=document.createElement("input");control.className="input";control.type="text";control.autocomplete="off"}const feedback=document.createElement("div");feedback.className="feedback";feedback.hidden=true;section.append(control,feedback);form.append(section);rendered.push({question,control,feedback})});const actions=document.createElement("div");actions.className="actions";const submit=document.createElement("button");submit.type="submit";submit.className="button primary";submit.textContent="Check and send for review";const reset=document.createElement("button");reset.type="button";reset.className="button";reset.textContent="Reset";actions.append(submit,reset);form.append(actions);const summary=document.createElement("div");summary.className="summary";summary.hidden=true;const answers=document.createElement("div");answers.className="answers";const copy=document.createElement("button");copy.type="button";copy.className="button";copy.textContent="Copy answers";const status=document.createElement("div");status.className="status";summary.append(answers,document.createElement("br"),copy,status);form.append(summary);card.append(form);shell.append(card);app.append(shell);let last=null;form.addEventListener("submit",async event=>{event.preventDefault();submit.disabled=true;let correct=0,total=0;const responses=[];rendered.forEach(item=>{const q=item.question,r=responseFor(item);item.feedback.hidden=false;item.feedback.className="feedback";if(q.type==="multiple_choice"){total++;if(!r.value){item.feedback.classList.add("muted");item.feedback.textContent="Unanswered";responses.push({questionId:q.id,type:q.type,prompt:q.prompt,response:"",value:"",localStatus:"unanswered",needsReview:false})}else{const ok=r.value===q.answer;if(ok)correct++;item.feedback.classList.add(ok?"good":"bad");item.feedback.textContent=`${ok?"Correct.":"Incorrect."}${q.explanation?` ${q.explanation}`:""}`;responses.push({questionId:q.id,type:q.type,prompt:q.prompt,response:r.raw,value:r.value,localStatus:ok?"correct":"incorrect",needsReview:false})}}else{const answered=Boolean(r.value);item.feedback.classList.add("muted");item.feedback.textContent=answered?"Needs semantic review — not exact-string graded.":"Unanswered";responses.push({questionId:q.id,type:q.type,prompt:q.prompt,response:r.raw,localStatus:answered?"needs_review":"unanswered",needsReview:answered,reviewHint:q.reviewHint||""})}});last={reviewId:data.id,title:data.title||"",submittedAt:new Date().toISOString(),closedForm:{correct,total},responses};answers.textContent=`Multiple choice: ${correct} / ${total}\n\n${formatted(last)}`;summary.hidden=false;status.textContent="Sending answers to the conversation…";await sendForReview(last,status);submit.disabled=false});copy.addEventListener("click",async()=>{if(!last)return;const ok=await copyText(formatted(last));status.textContent=ok?"Copied answers.":"Copy failed; select the answer block manually."});reset.addEventListener("click",()=>{form.reset();rendered.forEach(({feedback})=>{feedback.hidden=true;feedback.textContent=""});summary.hidden=true;last=null;status.textContent=""})}
(async()=>{try{await request("ui/initialize",{appInfo:{name:"chappie-review",version:"0.2.0"},appCapabilities:{},protocolVersion:"2026-01-26"});bridgeReady=true;notify("ui/notifications/initialized",{})}catch(error){console.error("Chappie review bridge initialization failed",error);app.textContent="Unable to initialize the Chappie review component."}})();
</script>
</body>
</html>
